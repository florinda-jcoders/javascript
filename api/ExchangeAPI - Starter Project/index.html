<!DOCTYPE html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kembimore - Frankfurter API</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
        <img src="https://cdn-icons-png.freepik.com/512/5373/5373076.png" alt="Bank Logo" class="logo">
      <h1>Kembimore Monedhash</h1>
      <input type="number" id="amount" placeholder="Shuma" value="1" />
      <select id="fromCurrency">
        <option value="EUR">EUR</option>
        <option value="USD">USD</option>
        <option value="GBP">GBP</option>
        <option value="JPY">JPY</option>
        <option value="CHF">CHF</option>
        <option value="RON">RON</option>
        <option value="ZAR">ZAR</option>
        <option value="CZK">CZK</option>
        <option value="TRY">TRY</option>
        <option value="CAD">CAD</option>
      </select>
      <select id="toCurrency">
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="GBP">GBP</option>
        <option value="JPY">JPY</option>
        <option value="CHF">CHF</option>
        <option value="RON">RON</option>
        <option value="ZAR">ZAR</option>
        <option value="CZK">CZK</option>
        <option value="TRY">TRY</option>
        <option value="CAD">CAD</option>
      </select>
      <button id="convertBtn">Konverto</button>
      <div class="result" id="result"></div>
      <div class="timestamp" id="timestamp"></div>
    </div>

    <script src="index.js">
      
    </script>
  </body>
</html>

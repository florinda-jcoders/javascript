<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banka Qendrore e Kosoves</title>
  <link rel="stylesheet" href="../css/llogaria-bankare.css" />
</head>

<body>
  <div class="container">
    <p class="title">Informatat rreth llogarise tuaj</p>
    <p>Nr. i xhirollogarise:</p>
    <p id="infoXhiro"></p>
    <p>Shuma e gatshme e parave:</p>
    <p id="infoSumXhiro"></p>
    <p>Jepni shumen per depozit: </p>
    <input type="text" class="defaultInput" id="shumaDepozit" minlength="4">
    <input type="submit" class="krijoButoni" id="signUpButton" value="Depozito">
    <p>Jepni shumen per terheqje</p>
    <input type="text" class="defaultInput" id="shumaTerheqja" minlength="4">
    <input type="submit" class="krijoButoni" id="signUpButton" value="Terhiq">

  </div>
  <script src="../js/llogariaBankare.js"></script>
</body>

</html>

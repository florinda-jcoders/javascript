<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banka Qendrore e Kosoves</title>
  <link rel="stylesheet" href="../css/llogaria-bankare.css" />
</head>

<body>
  <div class="container">
    <p class="title">Informatat rreth llogarise tuaj</p>
    <p>Jepni numrin e xhirollogarise:</p>
    <input type="text" class="defaultInput" id="nrXhirollogarise" minlength="16" required>
    <p>Jepni pin e xhirollogarise:</p>
    <input type="password" class="defaultInput" id="pinXhirollogarise" minlength="4" required>
    <p>Jepni numrin tuaj te telefonit:</p>
    <input type="text" class="defaultInput" id="nrTelXhirollogarise" minlength="4" required>
    <input type="submit" class="krijoButoni" id="krijoLlogarineButton" value="Krijo Llogari">
  </div>
  <script src="../js/llogariaBankare.js"></script>
</body>

</html>
